name: build-script

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    name: Tracking script is built from source

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run types:check

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Committed build matches the source
        run: git diff --exit-code resources/dist
